    <!-- GA4 (gtag.js, ~172 КБ) грузится ПОСЛЕ первой отрисовки: раньше скрипт стартовал
         до бандлов приложения и блокировал main thread, поднимая FCP.
         Триггер — запись first-contentful-paint из PerformanceObserver('paint').
         Сознательно НЕ используем:
           - requestIdleCallback: выстреливает в сетевой паузе (поток свободен, пока ждём
             модули) — то есть до первой отрисовки;
           - событие load: в холодном профиле load может пройти раньше первой отрисовки
             (замер LH: load 390 мс при FCP 2680 мс), и счётчик снова тормозит первую краску;
           - первую paint-запись (first-paint): она выходит раньше FCP.
         Аварийный таймаут 5 с — только на случай, если paint-записи не придут.
         Команды gtag() ниже встают в очередь dataLayer и выполнятся при загрузке скрипта.
         SPA-переходы, как и раньше, отдельных page_view не шлют. При saveData не грузим. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BBL2VDP0WK');

      (function () {
        var GA_SRC = 'https://www.googletagmanager.com/gtag/js?id=G-BBL2VDP0WK';
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = GA_SRC;
          document.head.appendChild(s);
        }
        if (navigator.connection && navigator.connection.saveData === true) return;
        if (typeof window.PerformanceObserver === 'function') {
          try {
            var po = new PerformanceObserver(function (list, obs) {
              var entries = list.getEntries();
              for (var i = 0; i < entries.length; i++) {
                if (entries[i].name === 'first-contentful-paint') {
                  obs.disconnect();
                  loadGtag();
                  return;
                }
              }
            });
            po.observe({ type: 'paint', buffered: true });
          } catch (e) {}
        }
        setTimeout(loadGtag, 5000);
      })();
    </script>
