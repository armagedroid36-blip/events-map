ять себя и свои отношения. Если вам знакомо: «Я слишком сильно привязываюсь» «Я постоянно боюсь, что меня бросят» «Как только человек становится слишком близким — мне хочется исчезнуть» «Почему меня так тянет к эмоционально недоступным людям?» — эта встреча для вас. 🗓️ 6 сентября (вс) в 19:00 📍Wind Garden ✅ Стоимость: 250k VND 👥 Количество мест ограничено 📩 Запись: @Dana_psychology #дата: 6.09","image":"https://cdn4.telesco.pe/file/RILMvBceatP5hOJwRXWRFWGvHPIe2ZuG-gFJW7R7LAl5lYQk9zKUotSfvebkIhzjMb-Abg5mfSraHqZu043Cd7qa-t092IRZrS6qtzcmttGaUHCqU9rMksfOC-H5Zb0i9R3BoSfaeCAZzDeRI_dSQ5Z29zJ7IQf2fzH0iku6xovt7b1xuoit0a99Z5f1jxs7qNZzJNLmiKCOy5-w-eKrpBy3lU_RLBeEIB1dBhZswu8lebJ3h3r1CRJBnLxmxWXnEXszWMysjZtLaQUaF9EHnQt1SrBX613OXu1n2kEFLNpEBpLGnB7ajshydJ55AJ15oWU9C-4AghkOvpMXJaw1kg.jpg","inLanguage":"ru"}</script>
