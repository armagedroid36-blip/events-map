name: Collect events

on:
  schedule:
    # ~Полдень (12:30) и полночь (00:30) по Бали (WITA = UTC+8): 04:30 и 16:30 UTC.
    # Сдвинуто с 04:00/16:00: 04:00 UTC попадало в пиковое окно DeepSeek (01:00–04:00 UTC),
    # 04:30/16:30 UTC — стабильно офф-пик (цены DeepSeek ×0.5).
    - cron: '30 4,16 * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Сбор событий из Telegram-афиш (Нячанг, Дананг)
        if: always()
        run: node scripts/collect-tg.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Дозаполнение адресов (backfill)
        # Подготовительный шаг: его сбой НЕ должен съедать слот сбора.
        # 09.11 402 на чтении базы здесь отменил Бали/Кипр/театр — за сутки не собрано ничего.
        if: always()
        continue-on-error: true
        run: node scripts/backfill-address.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Бесплатные события (backfill-free)
        if: always()
        continue-on-error: true
        run: node scripts/backfill-free.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Сбор событий с Балифорума
        if: always()
        run: node scripts/collect-bali.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Сбор событий Кипра (VisitCyprus, Cyprus Now, Cyprus.BZ, Восточный Кипр)
        if: always()
        run: node scripts/collect-cyprus.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Сбор театральных событий (самообход источников)
        if: always()
        run: node scripts/collect-theatres.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Дозаполнение контактов из описаний (WA/тел/тг/почта/инста)
        if: always()
        continue-on-error: true
        run: node scripts/backfill-contacts.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      - name: Дозаполнение EN-переводов
        if: always()
        continue-on-error: true
        run: node scripts/backfill-translations.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LIMIT: '300'
      - name: Дедупликация карточек событий
        if: always()
        run: node scripts/dedupe-events.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      - name: Архивация прошедших событий
        if: always()
        run: node scripts/archive-past.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      - name: Автопроверка собранных событий и публикация
        # Проверка правилами + LLM; прошедшие публикуются сразу, спорные остаются
        # на модерации человеку, грубые нарушения отклоняются.
        # Очередь разбирается пакетами (100 карточек за запрос) до исчерпания:
        # суточный сбор Кипра/Бали публикуется целиком за один запуск, хвост
        # очереди не ждёт следующего запуска. Предохранители — 300 вызовов LLM
        # и 30 минут на прогон.
        if: always()
        run: node scripts/moderate-events.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODERATION_MAX_LLM: '300'
          MODERATION_MAX_MINUTES: '30'
      - name: Заморозка слагов событий
        # Хвост URL фиксируется при первой публикации (slug_ru/slug_en) и больше
        # не зависит от title_ru/title_en: правка названия не меняет адрес
        # страницы в sitemap, canonical и ссылках SPA. Шаг идёт ПОСЛЕ автопубликации,
        # чтобы событие, опубликованное этим прогоном, получило слаг сразу.
        # Идемпотентен: заполненные значения не перезаписываются.
        if: always()
        run: node scripts/freeze-event-slugs.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      - name: Уведомление о новых событиях
        if: always()
        run: node scripts/notify-moderation.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
