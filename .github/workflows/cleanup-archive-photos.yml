name: Cleanup archive photos

on:
  schedule:
    # Ежедневно 03:30 UTC: удаление фото завершившихся событий из storage
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Очистка фото архива (завершившиеся события)
        run: python scripts/cleanup-archive-photos.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
