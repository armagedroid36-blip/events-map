name: Rebuild GitHub Pages

# Автосборка статики (пре-рендер + sitemap) и публикация в gh-pages по
# расписанию, чтобы статика не отставала от живой БД: сборщик событий
# (collect-events) наполняет БД дважды в сутки, а пре-рендер фиксирует снимок
# на момент сборки — без пересборки в sitemap остаются URL прошедших событий,
# а посадочные «город × категория» с упавшим числом событий (< MIN_CATEGORY_EVENTS)
# продолжают отдаваться статикой, хотя SPA на них уже отдаёт 404.
#
# Расписание (UTC):
#   05:10 — после ночной архивации (collect-events + archive-past, 04:30 UTC):
#           событие с закончившимся периодом к моменту сборки уже лежит в
#           list_past_events и получает архивную страницу. Прежний слот 00:15
#           стоял ДО архивации: закончившееся вчера событие не попадало ни в
#           активный, ни в архивный набор, страница не писалась, а публикация с
#           keep_files:false удаляла прежний файл → 404 на известный Google URL.
#   17:50 — после дневной архивации (16:30 UTC), чтобы свежие события попали
#           в статику и sitemap в тот же вечер.
# GitHub задерживает scheduled-запуски (наблюдалось до нескольких часов):
# задержка только сдвигает сборку ПОЗЖЕ архивации — окна не создаёт.
#
# Только чтение main и запись gh-pages: main не коммитим, buildVersion
# в src/config.ts НЕ бампаем (автосборка — не релиз, версия живёт в ручных
# деплоях). Сборка идёт ровно тем же `npm run build`, что и локально.

on:
  schedule:
    - cron: '10 5 * * *'
    - cron: '50 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rebuild-pages
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Sitemap ПРЕДЫДУЩЕЙ опубликованной сборки — источник правды о URL
      # событий, которые прод отдавал до этой сборки. Хвост URL строится из
      # перевода (title_ru/title_en), поэтому правка заголовка опубликованного
      # события меняет адрес, и прежний URL иначе отдаёт 404. Снимок нужен
      # пре-рендеру (env PREV_SITEMAP): URL, которых нет в новой сборке, но чьё
      # событие есть под другим хвостом, получают страницу-алиас штатным циклом.
      # Недоступность прода или пустой файл — НЕ фатальны: файл не создаём,
      # пре-рендер пропустит источник и напишет в build.log
      # «prev-sitemap недоступен — алиасы по дифу пропущены».
      - name: Снимок sitemap предыдущей сборки
        shell: bash
        run: |
          if curl -sSfL --max-time 60 https://mypins.site/sitemap.xml -o "$RUNNER_TEMP/prev-sitemap.xml" \
             && grep -q '<loc>' "$RUNNER_TEMP/prev-sitemap.xml"; then
            echo "prev-sitemap: $(grep -c '<loc>' "$RUNNER_TEMP/prev-sitemap.xml") URL → $RUNNER_TEMP/prev-sitemap.xml"
          else
            rm -f "$RUNNER_TEMP/prev-sitemap.xml"
            echo "prev-sitemap недоступен — алиасы по дифу пропущены"
          fi

      # Второй снимок прода: постоянный РЕЕСТР страниц-алиасов (/data/alias-urls.json).
      # Алиасы в sitemap не попадают по замыслу, поэтому sitemap предыдущей сборки —
      # единственный автоматический источник прежних URL, но он «одноразовый»: адрес
      # алиаса из прошлой сборки в новом sitemap уже не появится, и без реестра алиас
      # перестаёт пересоздаваться → 404 на адрес, который Google знает (потеря
      # /en/bali/cinema/, 17.10.2026). Пре-рендер сливает реестр с затравкой
      # scripts/data/alias-urls.json и перезаписывает его ровно теми путями, для
      # которых в новой сборке реально написана страница-алиас.
      # Недоступность/пустой/битый файл — НЕ фатальны: реестр источника просто
      # не получит, причина уйдёт в build.log (как у PREV_SITEMAP).
      - name: Реестр алиасов предыдущей сборки
        shell: bash
        run: |
          if curl -sSfL --max-time 60 https://mypins.site/data/alias-urls.json \
               -o "$RUNNER_TEMP/alias-urls.json" \
             && grep -q '^\[' "$RUNNER_TEMP/alias-urls.json"; then
            echo "alias-urls: $(grep -o '","' "$RUNNER_TEMP/alias-urls.json" | wc -l) + 1 путей → $RUNNER_TEMP/alias-urls.json"
          else
            rm -f "$RUNNER_TEMP/alias-urls.json"
            echo "реестр алиасов недоступен — источники: затравка + sitemap прошлой сборки"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      # Ключи нужны и Vite (VITE_* вшиваются в бандл), и пре-рендеру
      # (scripts/seo-prerender.mjs читает VITE_SUPABASE_URL /
      # VITE_SUPABASE_ANON_KEY из env; без них сборка падает на exit 1).
      #
      # shell: bash здесь не для красоты. Дефолтная оболочка шага — bash -e {0}
      # (без pipefail), поэтому в `npm run build 2>&1 | tee build.log` код шага
      # равнялся коду tee и падение сборки не валило шаг: 28.09 так уехал
      # частичный dist, и прод 23 часа отдавал 404. Явный shell: bash даёт
      # `bash --noprofile --norc -eo pipefail {0}` — падение любого звена
      # (tsc -b && vite build && пре-рендер && 404) валит шаг, и публикация
      # в gh-pages не выполняется.
      - name: Сборка (tsc + vite + пре-рендер + sitemap)
        shell: bash
        run: npm run build 2>&1 | tee build.log
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Снимок прода из шага выше: пре-рендер сверяет хвосты URL событий и
          # пишет страницы-алиасы для прежних адресов (недоступный файл — не
          # ошибка, источник просто пропускается).
          PREV_SITEMAP: ${{ runner.temp }}/prev-sitemap.xml
          # Реестр алиасов предыдущей сборки (шаг выше): пре-рендер читает пути
          # из него вместе с затравкой scripts/data/alias-urls.json и пишет по
          # ним страницы-алиасы, если каноническая цель в сборке есть.
          ALIAS_REGISTRY: ${{ runner.temp }}/alias-urls.json

      # Лог сборки сохраняем ВСЕГДА (даже когда шаг упал): логи Actions по API
      # отдают 403, поэтому без артефакта причину сбоя 28.09 установить было нечем.
      - name: Артефакт лога сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Итоги сборки (счётчики)
        run: |
          echo "===== Итоги пре-рендера ====="
          grep -E 'событий:|EN-событий|категорий:|ячеек|организаторов:|статей:|sitemap|битых ссылок' build.log || true
          echo "===== Страницы в dist ====="
          echo "всего index.html:      $(find dist -name index.html -not -name 404.html | wc -l)"
          echo "страниц событий:       $(find dist/event -name index.html | wc -l) RU / $(find dist/en/event -name index.html | wc -l) EN"
          echo "ячеек город×категория: $(for c in bali da-nang nha-trang; do find "dist/$c" -mindepth 2 -maxdepth 2 -name index.html; done | wc -l) RU / $(for c in bali da-nang nha-trang; do find "dist/en/$c" -mindepth 2 -maxdepth 2 -name index.html; done | wc -l) EN"
          echo "URL в sitemap:         $(grep -c '<loc>' dist/sitemap.xml)"
          echo "дата сборки в статике: $(grep -o 'Афиша обновлена: <time datetime=\"[0-9-]*\"' dist/bali/index.html | head -1)"

      # Второй барьер перед публикацией: код возврата шага сборки проверяет
      # «упало ли», а этот шаг — «получилось ли». Пустой или частичный dist
      # (как 28.09) валит пайплайн здесь, и в gh-pages ничего не уезжает.
      - name: Проверка целостности dist
        run: node scripts/verify-dist.mjs

      # Деплой строго ПОСЛЕ успешной сборки: если build упал, шаг не
      # выполняется и прод остаётся прежним (частичный dist не публикуется).
      # keep_files: false — ветка полностью заменяется содержимым dist
      # (CNAME лежит в public/ и попадает в dist), поэтому снятые с публикации
      # страницы исчезают из ветки и начинают отдавать 404.html с кодом 404.
      - name: Публикация в gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Auto rebuild: prerender + sitemap'

      # GitHub Pages отдаёт свежие файлы не мгновенно (CDN/кэш ~минута): без
      # паузы гейты ниже проверяли бы прежнюю публикацию и падали бы «на
      # ровном месте» — например, на /data/legacy-events.json, которого в
      # прошлой сборке ещё не было.
      - name: Ожидание публикации
        run: sleep 45

      # Гейт 1: КАЖДЫЙ URL события из прод-sitemap резолвится тем же путём, что
      # в SPA (активный набор → get_public_event → снимок удалённого события).
      # Нерезолвящийся URL с ответом 200 = «ложная ошибка 404» в Search Console.
      # Выход 1 — есть нерезолвящиеся, выход 2 — проверить не удалось (сетевые
      # сбои); оба валят шаг: молча публиковать такое нельзя.
      - name: Гейт «резолв SPA по sitemap»
        shell: bash
        run: node scripts/check-sitemap-resolve.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Гейт 2: рендер настоящим браузером (headless Chrome на раннере) — оба
      # URL снимков удалённых событий и 5 случайных страниц из sitemap. В
      # отрендеренном DOM не должно быть заглушек «Событие не найдено или уже
      # завершено» / «404 — страница не найдена», а у страниц снимков должны
      # быть h1 с названием, canonical на сам URL и hreflang-пара.
      - name: Гейт «рендер страниц событий»
        shell: bash
        run: node scripts/check-render-soft404.mjs
        env:
          # Раннеры GitHub держат Chrome в /usr/bin/google-chrome; путь можно
          # переопределить через RENDER_BROWSER (Edge на Windows, chromium).
          RENDER_BROWSER: ${{ vars.RENDER_BROWSER }}

      # Оповещаем Яндекс и Bing о свежих страницах (IndexNow): новые события,
      # карточки и посадочные попадают в очередь обхода в тот же день.
      # Ключ — публичный файл из dist, ничего секретного.
      - name: IndexNow — оповестить поисковики
        run: node scripts/indexnow.mjs
        env:
          # оповещаем ВСЕ URL (RU + EN); INDEXNOW_RU_ONLY=1 — опт-ин «только RU»
          INDEXNOW_RU_ONLY: "0"
        continue-on-error: true
