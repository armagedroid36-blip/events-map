    <!-- GA4 (gtag.js, ~172 КБ) грузится ПОСЛЕ первой отрисовки и не конкурирует с LCP:
         раньше скрипт стартовал по записи first-contentful-paint и через ~450 мс
         занимал main thread ровно в окне LCP (third-party-summary, 28.10.2026).
         Триггер — ПЕРВОЕ из событий:
           (а) первое взаимодействие пользователя: pointerdown / keydown / touchstart (once);
           (б) requestIdleCallback после FCP + задержка 800 мс — счётчик грузится в простое;
           (в) аварийный таймаут 4 с — если ни paint-записи, ни простоя не было.
         Команды gtag() ниже встают в очередь dataLayer и выполнятся при загрузке скрипта;
         SPA-переходы отдельных page_view не шлют. При saveData не грузим. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BBL2VDP0WK');

      (function () {
        var GA_SRC = 'https://www.googletagmanager.com/gtag/js?id=G-BBL2VDP0WK';
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = GA_SRC;
          document.head.appendChild(s);
        }
        if (navigator.connection && navigator.connection.saveData === true) return;

        // (а) первое взаимодействие — раньше этого счётчик не нужен
        var INTERACT = ['pointerdown', 'keydown', 'touchstart'];
        for (var i = 0; i < INTERACT.length; i++) {
          window.addEventListener(INTERACT[i], loadGtag, { once: true, capture: true, passive: true });
        }

        // (б) после FCP + 800 мс в простое
        function afterFcp() {
          var fire = function () { setTimeout(loadGtag, 800); };
          if (typeof window.requestIdleCallback === 'function') {
            window.requestIdleCallback(fire, { timeout: 2000 });
          } else {
            fire();
          }
        }
        if (typeof window.PerformanceObserver === 'function') {
          try {
            var po = new PerformanceObserver(function (list, obs) {
              var entries = list.getEntries();
              for (var j = 0; j < entries.length; j++) {
                if (entries[j].name === 'first-contentful-paint') {
                  obs.disconnect();
                  afterFcp();
                  return;
                }
              }
            });
            po.observe({ type: 'paint', buffered: true });
          } catch (e) {}
        }

        // (в) аварийный таймаут
        setTimeout(loadGtag, 4000);
      })();
    </script>
