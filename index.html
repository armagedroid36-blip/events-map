    <!-- GA4 (gtag.js, ~172 КБ) грузится ПОСЛЕ первой отрисовки: раньше скрипт стартовал
         до бандлов приложения и блокировал main thread, поднимая FCP.
         Триггер — событие первой отрисовки (PerformanceObserver 'paint': запись приходит
         уже ПОСЛЕ отрисовки), страховка — load+setTimeout (старые браузеры без
         PerformanceObserver). requestIdleCallback НЕ используется: он выстреливает
         в сетевой паузе, пока браузер ждёт модули, то есть до первой отрисовки.
         Команды gtag() ниже встают в очередь dataLayer и выполнятся при загрузке скрипта.
         SPA-переходы, как и раньше, отдельных page_view не шлют. При saveData не грузим. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BBL2VDP0WK');

      (function () {
        var GA_SRC = 'https://www.googletagmanager.com/gtag/js?id=G-BBL2VDP0WK';
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = GA_SRC;
          document.head.appendChild(s);
        }
        function afterLoad() {
          window.addEventListener('load', function () { setTimeout(loadGtag, 0); });
        }
        if (navigator.connection && navigator.connection.saveData === true) return;
        if (typeof window.PerformanceObserver === 'function') {
          try {
            var po = new PerformanceObserver(function (list, obs) {
              obs.disconnect();
              loadGtag();
            });
            po.observe({ type: 'paint', buffered: true });
            afterLoad();
          } catch (e) {
            afterLoad();
          }
        } else {
          afterLoad();
        }
      })();
    </script>
