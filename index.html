    <!-- GA4: грузим после первого из событий — (а) взаимодействие пользователя,
         (б) window.load + простой (requestIdleCallback, задержка 800 мс),
         (в) аварийный таймаут 6 с. Команды gtag() стоят в очереди dataLayer и
         выполнятся при загрузке скрипта; при saveData не грузим. -->
    <script>
      window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
      gtag('js',new Date());gtag('config','G-BBL2VDP0WK');
      (function(){var S='https://www.googletagmanager.com/gtag/js?id=G-BBL2VDP0WK',done=false;
      function go(){if(done)return;done=true;var s=document.createElement('script');s.async=true;s.src=S;document.head.appendChild(s);}
      if(navigator.connection&&navigator.connection.saveData===true)return;
      var ev=['pointerdown','keydown','touchstart'];
      for(var i=0;i<ev.length;i++)window.addEventListener(ev[i],go,{once:true,capture:true,passive:true});
      function idle(){var f=function(){setTimeout(go,800)};if(window.requestIdleCallback)requestIdleCallback(f,{timeout:2000});else f();}
      function afterFcp(){if(document.readyState==='complete')idle();else window.addEventListener('load',idle,{once:true});}
      if(window.PerformanceObserver){try{var p=new PerformanceObserver(function(l,o){var e=l.getEntries();for(var j=0;j<e.length;j++)if(e[j].name==='first-contentful-paint'){o.disconnect();afterFcp();return;}});p.observe({type:'paint',buffered:true});}catch(x){}}
      setTimeout(go,6000);})();
    </script>
