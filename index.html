    <!-- Supabase (категории карточки + полный объект события): соединение
         (DNS+TLS) поднимаем сразу при разборе HTML. Иначе первый RPC ждёт
         хендшейк, и карточка события рисуется на 0,3-0,5 с позже (LCP).
         Адрес подставляет Vite из VITE_SUPABASE_URL — тот же, что в config. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- GA4: грузим ТОЛЬКО по взаимодействию/уходу со страницы. Аварийный
         таймер удалён в beta 1.21: gtag.js (178 КБ, eval ~305 мс) приходил по
         setTimeout(15000) — уже после загрузки, но Lantern относил его к окну
         TBT, и он давал 340-661 мс из 446-838 мс TBT (76-79%).
         Триггеры: pointerdown/keydown/touchstart/scroll (once, capture) и
         visibilitychange=hidden (ушли со страницы). Ноль запросов к
         googletagmanager/google-analytics, пока посетитель не взаимодействовал.
         Команды gtag() стоят в очереди dataLayer и выполнятся при загрузке
         скрипта; при saveData не грузим. -->
    <script>
      window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
      gtag('js',new Date());gtag('config','G-BBL2VDP0WK');
      (function(){var S='https://www.googletagmanager.com/gtag/js?id=G-BBL2VDP0WK',done=false;
      function go(){if(done)return;done=true;var s=document.createElement('script');s.async=true;s.src=S;document.head.appendChild(s);}
      if(navigator.connection&&navigator.connection.saveData===true)return;
      var ev=['pointerdown','keydown','touchstart'];
      for(var i=0;i<ev.length;i++)window.addEventListener(ev[i],go,{once:true,capture:true,passive:true});
      window.addEventListener('scroll',go,{once:true,capture:true,passive:true});
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')go();},{once:true});})();
    </script>
